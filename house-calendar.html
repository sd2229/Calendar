<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Ultimate House Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F3EADB; --surface:rgba(252,248,240,.72); --surface-2:rgba(243,234,217,.76); --ink:#241B11; --ink-2:#5C4B37;
  --muted:#93826A; --rule:#E3D6BF; --rule-strong:#CBB79A; --accent:#C1551B; --accent-ink:#FBF6EC;
  --green:#2F5D3F; --house:#8A5F31; --house-op:.32;
  --house-photo:url('house.jpg'); --house-draw:none; --house-scrim:.80;
  --shadow:0 1px 2px rgba(36,27,17,.07),0 10px 30px -14px rgba(36,27,17,.28);
  --t-hm:#2a78d6; --t-cm:#eb6834; --t-forum:#1baf7a; --t-pref:#eda100;
  --t-soc:#e87ba4; --t-kitchen:#008300; --t-world:#4a3aa7; --t-dl:#e34948;
  --break-wash:rgba(193,85,27,.11);
  --fs-d:'EB Garamond',Garamond,Georgia,'Times New Roman',serif;
  --fs-m:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15100A; --surface:rgba(30,24,17,.76); --surface-2:rgba(39,31,22,.80); --ink:#F6EEE0; --ink-2:#C9B79C;
  --muted:#93816A; --rule:#31281B; --rule-strong:#4A3D2A; --accent:#E8843F; --accent-ink:#15100A;
  --green:#7FB38F; --house:#E0A867; --house-op:.30;
  --shadow:0 1px 2px rgba(0,0,0,.55),0 10px 30px -14px rgba(0,0,0,.75);
  --t-hm:#3987e5; --t-cm:#d95926; --t-forum:#199e70; --t-pref:#c98500;
  --t-soc:#d55181; --t-kitchen:#008300; --t-world:#9085e9; --t-dl:#e66767;
  --break-wash:rgba(232,132,63,.13);
}}
:root[data-theme="dark"]{
  --bg:#15100A; --surface:rgba(30,24,17,.76); --surface-2:rgba(39,31,22,.80); --ink:#F6EEE0; --ink-2:#C9B79C;
  --muted:#93816A; --rule:#31281B; --rule-strong:#4A3D2A; --accent:#E8843F; --accent-ink:#15100A;
  --green:#7FB38F; --house:#E0A867; --house-op:.30;
  --shadow:0 1px 2px rgba(0,0,0,.55),0 10px 30px -14px rgba(0,0,0,.75);
  --t-hm:#3987e5; --t-cm:#d95926; --t-forum:#199e70; --t-pref:#c98500;
  --t-soc:#d55181; --t-kitchen:#008300; --t-world:#9085e9; --t-dl:#e66767;
  --break-wash:rgba(232,132,63,.13);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--fs-d);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:var(--fs-d);font-size:inherit;color:inherit}
h1,h2,h3,h4{margin:0;text-wrap:balance;font-weight:600}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.wrap{max-width:1280px;margin:0 auto;padding-inline:16px;padding-block:0 56px;position:relative;z-index:1}
.lab{font-family:var(--fs-m);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;font-weight:600}

/* ---------- house watermark (original drawing; swap for a photo) ---------- */
.housebg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  background-image:var(--house-photo,none);background-size:cover;background-position:center 35%}
.housebg::after{content:"";position:absolute;inset:0;background:var(--bg);opacity:var(--house-scrim,.8)}
.housebg svg{position:absolute;left:50%;bottom:-2vh;transform:translateX(-50%);width:min(2100px,185%);height:auto;
  opacity:var(--house-op);color:var(--house);display:var(--house-draw,block)}

/* ---------- masthead ---------- */
.mast{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--rule)}
.mast-in{max-width:1280px;margin:0 auto;padding:13px 16px 10px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:baseline}
.wordmark{font-size:29px;font-weight:600;letter-spacing:-.005em;line-height:1}
.wordmark em{font-style:italic;font-weight:500;color:var(--accent)}
.kicker{color:var(--muted);display:block;margin-bottom:5px}
.mast-spacer{flex:1 1 30px}
.tabs{display:flex;gap:2px;background:var(--surface-2);border:1px solid var(--rule);border-radius:999px;padding:3px}
.tabs button{background:none;border:0;padding:4px 13px;border-radius:999px;font-size:14px;font-weight:600;color:var(--ink-2);cursor:pointer;letter-spacing:.01em}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.navbar{display:flex;align-items:center;gap:8px}
.navbtn{width:30px;height:30px;border-radius:8px;border:1px solid var(--rule-strong);background:var(--surface);cursor:pointer;display:grid;place-items:center;color:var(--ink-2);padding:0}
.navbtn:hover{border-color:var(--accent);color:var(--accent)}
.period{font-size:21px;font-weight:600;min-width:9ch;letter-spacing:-.005em}
.btn{border:1px solid var(--rule-strong);background:var(--surface);border-radius:8px;padding:5px 12px;font-size:14px;font-weight:600;cursor:pointer;color:var(--ink)}
.btn:hover{background:var(--surface-2);border-color:var(--accent)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{background:var(--accent);border-color:var(--accent);filter:brightness(1.08)}
.btn-danger{color:var(--t-dl);border-color:var(--t-dl)}

/* ---------- legend ---------- */
.legend{display:flex;flex-wrap:wrap;gap:6px;padding:12px 0 10px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);background:var(--surface);border-radius:999px;padding:3px 12px 3px 9px;font-size:14px;font-weight:600;cursor:pointer;color:var(--ink-2);white-space:nowrap}
.chip[aria-pressed="false"]{opacity:.42}
.chip:hover{border-color:var(--rule-strong)}
.glyph{width:14px;height:14px;flex:none}
.legend-sep{width:1px;align-self:stretch;background:var(--rule);margin:2px 6px}
.selwrap{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
select.mini{border:1px solid var(--rule);background:var(--surface);border-radius:8px;padding:3px 8px;font-size:13.5px;font-weight:600;color:var(--ink)}

/* ---------- month ---------- */
.grid-head{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;margin-top:2px}
.grid-head div{color:var(--muted);padding:0 0 6px 6px;overflow:hidden;font-family:var(--fs-m);font-size:10px;letter-spacing:.13em;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.cell{background:var(--surface);min-height:124px;min-width:0;padding:5px 6px 7px;display:flex;flex-direction:column;gap:3px;text-align:left;border:0;cursor:pointer;font:inherit;color:inherit;position:relative;overflow:hidden}
.cell:hover{background:var(--surface-2)}
.cell.out{background:var(--surface-2);opacity:.6}
.cell.brk{background-image:repeating-linear-gradient(135deg,var(--break-wash) 0 7px,transparent 7px 15px)}
.cell-top{display:flex;align-items:center;gap:5px;min-height:20px;min-width:0}
.daynum{font-family:var(--fs-m);font-size:12.5px;font-weight:600;color:var(--ink-2);font-variant-numeric:tabular-nums}
.cell.today .daynum{background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:1px 5px;margin-left:-2px}
.brklabel{font-family:var(--fs-m);font-size:8.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bdays{margin-left:auto;display:flex;align-items:center;gap:3px;font-size:12px;color:var(--muted);max-width:62%;overflow:hidden}
.bdays span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev{display:flex;align-items:flex-start;gap:5px;font-size:13.5px;line-height:1.25;padding:1px 3px;border-radius:4px;min-width:0;max-width:100%}
.ev .bar{width:3px;align-self:stretch;border-radius:2px;flex:none;min-height:14px}
.ev .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500;min-width:0}
.ev .hr{font-family:var(--fs-m);font-size:10px;color:var(--muted);flex:none;padding-top:1px}
.ev.tbd .t{font-style:italic;color:var(--muted)}
.more{font-size:12px;color:var(--muted);font-weight:600;padding-left:8px;font-style:italic}

/* ---------- day ---------- */
.dayview{display:grid;grid-template-columns:270px minmax(0,1fr);gap:24px;margin-top:6px;background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:24px;box-shadow:var(--shadow)}
.dayrail .dow{font-family:var(--fs-m);letter-spacing:.18em;text-transform:uppercase;font-size:12px;color:var(--accent);font-weight:600}
.dayrail .num{font-size:96px;line-height:.86;font-weight:600;letter-spacing:-.03em;margin:6px 0 2px;font-variant-numeric:lining-nums}
.dayrail .mo{font-size:22px;color:var(--ink-2)}
.dayrail .note{margin-top:16px;padding-top:14px;border-top:1px solid var(--rule);display:flex;flex-direction:column;gap:8px}
.dayrail .note div{font-size:15px;color:var(--ink-2);display:flex;gap:7px;align-items:flex-start}
.dayitems{display:flex;flex-direction:column;gap:10px;min-width:0}
.ditem{display:grid;grid-template-columns:96px 4px minmax(0,1fr);gap:14px;align-items:stretch;background:none;border:0;padding:0;text-align:left;cursor:pointer;font:inherit;color:inherit}
.ditem .when{font-family:var(--fs-m);font-size:13px;color:var(--muted);padding-top:4px;font-variant-numeric:tabular-nums;text-align:right}
.ditem .bar{border-radius:2px}
.ditem .body{min-width:0;padding-bottom:10px;border-bottom:1px solid var(--rule)}
.ditem:last-child .body{border-bottom:0}
.ditem .h{font-size:22px;font-weight:600;letter-spacing:-.005em;line-height:1.2}
.ditem p{margin:4px 0 0;font-size:15px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ---------- agenda ---------- */
.agenda{margin-top:4px;display:flex;flex-direction:column;gap:3px}
.arow{display:grid;grid-template-columns:86px minmax(0,1fr);gap:14px;padding:9px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--rule)}
.arow.is-today{border-color:var(--accent)}
.adate{font-family:var(--fs-m);font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.11em;padding-top:4px}
.adate b{display:block;font-family:var(--fs-d);font-size:26px;color:var(--ink);letter-spacing:-.01em;font-variant-numeric:lining-nums;line-height:1.05}
.aitems{display:flex;flex-direction:column;gap:8px;min-width:0}
.aitem{display:flex;gap:10px;align-items:stretch;min-width:0;background:none;border:0;padding:0;text-align:left;cursor:pointer;font:inherit;color:inherit;width:100%}
.aitem .bar{width:3px;border-radius:2px;flex:none}
.atitle{font-weight:600;font-size:17px;letter-spacing:-.003em}
.ameta{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:3px 9px;margin-top:2px;align-items:center}
.ameta .mono{font-family:var(--fs-m);font-size:11.5px;font-variant-numeric:tabular-nums}
.tag{display:inline-flex;align-items:center;gap:4px;font-family:var(--fs-m);font-size:9px;letter-spacing:.09em;text-transform:uppercase;font-weight:600;border:1px solid var(--rule-strong);border-radius:5px;padding:1px 5px;color:var(--ink-2)}
.tag.warn{color:var(--t-dl);border-color:var(--t-dl)}

/* ---------- term ---------- */
.termwrap{overflow-x:auto;border:1px solid var(--rule);border-radius:12px;background:var(--surface);margin-top:4px;box-shadow:var(--shadow)}
table.term{border-collapse:collapse;width:100%;min-width:920px}
table.term th,table.term td{border-bottom:1px solid var(--rule);border-right:1px solid var(--rule);padding:7px 10px;vertical-align:top;text-align:left}
table.term th{position:sticky;top:0;background:var(--surface-2);font-family:var(--fs-m);font-size:9px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-2);z-index:1;white-space:nowrap}
table.term td:first-child,table.term th:first-child{position:sticky;left:0;background:var(--surface-2);z-index:2;min-width:120px}
table.term th:first-child{z-index:3}
table.term tr:last-child td{border-bottom:0}
.wk{font-family:var(--fs-m);font-size:11px;font-weight:600;font-variant-numeric:tabular-nums}
.wk small{display:block;font-family:var(--fs-d);font-size:12px;font-weight:400;color:var(--muted);letter-spacing:0;font-style:italic}
.wk.brk{color:var(--accent)}
.tcell{font-size:14px;display:flex;flex-direction:column;gap:3px}
.tcell button{background:none;border:0;padding:0;text-align:left;cursor:pointer;font:inherit;color:inherit;display:flex;gap:6px;align-items:flex-start;line-height:1.25}
.tcell .dot{width:6px;height:6px;border-radius:2px;margin-top:5px;flex:none}
tr.now td{background:color-mix(in srgb,var(--accent) 9%,transparent)}

/* ---------- tray / rules ---------- */
.tray{margin-top:28px}
.sec-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.sec-h h2{font-size:25px;letter-spacing:-.01em}
.sec-h p{margin:0;font-size:15px;color:var(--muted);max-width:64ch;font-style:italic}
.traygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(238px,1fr));gap:8px;margin-top:12px}
.traycard{background:var(--surface);border:1px solid var(--rule);border-left:3px solid var(--rule-strong);border-radius:0 9px 9px 0;padding:9px 12px;text-align:left;cursor:pointer;font:inherit;color:inherit}
.traycard:hover{border-color:var(--rule-strong);background:var(--surface-2)}
.traycard h4{font-size:16px;margin-bottom:1px;font-weight:600}
.traycard p{margin:0;font-size:13px;color:var(--muted)}
.rules{margin-top:28px}
.rulelist{display:grid;grid-template-columns:repeat(auto-fill,minmax(296px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:12px;overflow:hidden;margin-top:12px}
.rule{background:var(--surface);padding:12px 14px}
.rule b{display:block;font-size:16px;margin-bottom:2px}
.rule p{margin:0;font-size:14.5px;color:var(--ink-2)}
.cite{font-family:var(--fs-m);font-size:9.5px;color:var(--muted);letter-spacing:.05em;margin-top:5px;display:block;text-transform:uppercase}

/* ---------- drawer & modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(20,14,8,.45);z-index:60;opacity:0;pointer-events:none;transition:opacity .16s}
.scrim.on{opacity:1;pointer-events:auto}
.panel{position:fixed;z-index:61;background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column;
  top:0;right:0;bottom:0;width:min(430px,100%);border-left:1px solid var(--rule);transform:translateX(100%);transition:transform .2s ease}
.panel.on{transform:none}
.panel-h{padding:16px 18px 12px;border-bottom:1px solid var(--rule);display:flex;align-items:flex-start;gap:12px}
.panel-h h3{font-size:23px;letter-spacing:-.01em}
.panel-h .sub{font-family:var(--fs-m);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:3px;display:block;font-weight:600}
.x{margin-left:auto;background:none;border:1px solid var(--rule);border-radius:8px;width:28px;height:28px;cursor:pointer;color:var(--ink-2);flex:none;padding:0}
.panel-b{padding:14px 18px 22px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:10px}
.panel-f{padding:12px 18px;border-top:1px solid var(--rule);display:flex;gap:8px;flex-wrap:wrap;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.detail{border:1px solid var(--rule);border-left:3px solid var(--rule-strong);border-radius:0 9px 9px 0;padding:11px 13px;background:var(--surface)}
.detail h4{font-size:18px;margin-bottom:3px}
.detail .note{font-size:14.5px;color:var(--ink-2);margin:7px 0 0;white-space:pre-wrap}
.detail .acts{display:flex;gap:6px;margin-top:10px}
.linkout{font-size:14px;font-weight:600;color:var(--accent);text-decoration:none;display:inline-block;margin-top:7px}
.empty{color:var(--muted);font-size:16px;padding:10px 0;font-style:italic}
.modal{position:fixed;z-index:61;inset:auto 0 0 0;margin:0 auto;background:var(--surface);border:1px solid var(--rule);border-radius:16px 16px 0 0;box-shadow:var(--shadow);
  width:min(570px,100%);max-height:92vh;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .2s ease}
.modal.on{transform:none}
@media(min-width:700px){.modal{inset:auto;top:50%;left:50%;transform:translate(-50%,-46%) scale(.98);opacity:0;border-radius:16px;transition:transform .18s,opacity .18s}
 .modal.on{transform:translate(-50%,-50%);opacity:1}}
.form{padding:14px 18px 18px;overflow-y:auto;display:grid;gap:11px}
.field{display:grid;gap:4px}
.field label{font-family:var(--fs-m);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.field input,.field select,.field textarea{border:1px solid var(--rule-strong);background:var(--bg);border-radius:8px;padding:6px 9px;font-size:16px;width:100%}
.field textarea{resize:vertical;min-height:60px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px}
.checkline{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--ink-2)}
.checkline input{width:auto}
.hint{font-size:13.5px;color:var(--muted);margin:-2px 0 0;font-style:italic}
.banner{background:var(--surface);border:1px solid var(--rule);border-left:3px solid var(--accent);border-radius:0 9px 9px 0;padding:10px 13px;font-size:15px;color:var(--ink-2);margin-top:14px}
.banner b{color:var(--ink)}
.copybox{width:100%;font-family:var(--fs-m);font-size:12.5px;border:1px solid var(--rule-strong);border-radius:8px;padding:9px;background:var(--bg);min-height:130px}
.foot{margin-top:34px;padding-top:14px;border-top:1px solid var(--rule);font-size:13.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 18px;font-style:italic}

/* ---------- present / TV mode ---------- */
:root.tv body{font-size:21px}
:root.tv .wrap{max-width:none;padding-inline:30px;padding-block:0 20px}
:root.tv .mast-in{max-width:none;padding:14px 30px 10px}
:root.tv .legend,:root.tv .tray,:root.tv .rules,:root.tv .foot,:root.tv #statusbanner{display:none}
:root.tv .wordmark{font-size:34px}
:root.tv .period{font-size:26px}
:root.tv .cell{min-height:calc((100vh - 190px)/6)}
:root.tv .ev{font-size:19px}
:root.tv .ev .hr{font-size:13px}
:root.tv .daynum{font-size:17px}
:root.tv .brklabel{font-size:11px}
:root.tv .grid-head div{font-size:13px}
:root.tv .dayview{padding:34px;gap:36px;grid-template-columns:380px minmax(0,1fr)}
:root.tv .dayrail .num{font-size:160px}
:root.tv .dayrail .dow{font-size:18px}
:root.tv .dayrail .mo{font-size:32px}
:root.tv .ditem{grid-template-columns:140px 5px minmax(0,1fr);gap:20px}
:root.tv .ditem .h{font-size:32px}
:root.tv .ditem p,:root.tv .ditem .when{font-size:19px}
:root.tv .tag{font-size:12px}

@media(max-width:900px){
  .dayview{grid-template-columns:minmax(0,1fr);gap:18px;padding:18px}
  .dayrail{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  .dayrail .num{font-size:54px;margin:0}
  .dayrail .note{width:100%;margin-top:6px}
}
@media(max-width:820px){
  .cell{min-height:88px}
  .ev .hr{display:none}
  .arow{grid-template-columns:58px minmax(0,1fr);gap:10px}
  .wordmark{font-size:24px}
  .ditem{grid-template-columns:70px 4px minmax(0,1fr);gap:10px}
  .ditem .h{font-size:19px}
}
@media(max-width:600px){
  .cell{min-height:62px;padding:4px 3px 5px;gap:2px}
  .grid-head div{padding-left:3px;font-size:9px;letter-spacing:.05em}
  .daynum{font-size:11px}
  .brklabel,.bdays span{display:none}
  .ev{padding:0;gap:0}
  .ev .t,.more{display:none}
  .ev .bar{width:100%;min-height:3px;height:3px;align-self:auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="housebg" aria-hidden="true">

<script>
/* ============================ tracks & taxonomy ============================ */
const TRACKS = {
  hm:      {name:'Housemeeting', short:'HM',     color:'var(--t-hm)',      glyph:'gavel', blurb:'The weekly meeting and everything that belongs to it.'},
  cm:      {name:'Committees',   short:'Cttee',  color:'var(--t-cm)',      glyph:'grid',  blurb:'Eighteen committees, each with its own slot.'},
  forum:   {name:'PubSpeaks & CHEFs', short:'Speak', color:'var(--t-forum)', glyph:'speak', blurb:'PubSpeaks, CHEFs, faculty lectures, Faculty Dinner, TAWP.'},
  pref:    {name:'Preferment',   short:'Prefer', color:'var(--t-pref)',    glyph:'key',   blurb:'Open houses, readings, cuts, interviews.'},
  soc:     {name:'Socials',      short:'Social', color:'var(--t-soc)',     glyph:'glass', blurb:'House-hosted and elsewhere.'},
  kitchen: {name:'Kitchen & Upkeep', short:'House', color:'var(--t-kitchen)', glyph:'pot', blurb:'Kitchen shifts, cleaning, lock-up, guests.'},
  world:   {name:'Out in the World', short:'World', color:'var(--t-world)', glyph:'star', blurb:'Housemembers doing things worth showing up to.'},
  dl:      {name:'Deadlines',    short:'Due',    color:'var(--t-dl)',      glyph:'clock', blurb:'Things that are due to somebody.'}
};
const TRACK_KEYS = Object.keys(TRACKS);
const GLYPHS = {
  gavel:'<path d="M2 11h9v2H2zM6.5 2.2l4.3 4.3-1.9 1.9-4.3-4.3zM9 4.7l2.6 2.6"/>',
  grid:'<path d="M2 2h4v4H2zM7 2h4v4H7zM2 7h4v4H2zM7 7h4v4H7z"/>',
  speak:'<path d="M2 3h9v6H7l-3 3V9H2z"/>',
  key:'<circle cx="4.2" cy="4.2" r="2.4"/><path d="M6 6l5 5M9 9l1.4-1.4"/>',
  glass:'<path d="M3 2h7l-3 4.5V11M4.5 11h5"/>',
  pot:'<path d="M2.5 5h8v4.5a1.5 1.5 0 0 1-1.5 1.5H4a1.5 1.5 0 0 1-1.5-1.5zM1.5 5h10M6.5 2v2"/>',
  star:'<path d="M6.5 1.8l1.4 3 3.3.4-2.4 2.2.6 3.2-2.9-1.6-2.9 1.6.6-3.2L1.8 5.2l3.3-.4z"/>',
  clock:'<circle cx="6.5" cy="6.5" r="4.6"/><path d="M6.5 3.6v3l2 1.2"/>',
  cake:'<path d="M2.2 7.6h8.6v3.6H2.2zM2.2 9.4c1 0 1 .9 2.1.9s1.1-.9 2.2-.9 1.1.9 2.2.9 1.1-.9 2.1-.9M4.4 7.6V5.6M6.5 7.6V5.2M8.6 7.6V5.6M4.4 4.2v-.6M6.5 3.8v-.6M8.6 4.2v-.6"/>',
  cornell:'<path d="M2 3.4h9v7.4H2zM2 5.6h9M4.3 2.2v2.2M8.7 2.2v2.2"/><path d="M4 7.6h1.4M7.6 7.6H9M4 9.2h1.4M7.6 9.2H9" stroke-width="1.2"/>'
};
function glyphSVG(name,color){
  return '<svg class="glyph" viewBox="0 0 13 13" fill="none" stroke="'+color+'" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+GLYPHS[name]+'</svg>';
}
const COMMITTEES = [
  ['acaff','AcAff — Academic Affairs','Rejoice, Simran, Andy · Woofer: Sophie'],
  ['adcom','AdCom — Advisory','Urna, Braden, Sophie, Farah · Woofer: Tahm/Riya'],
  ['ec','ECs — Employee Coordinators','Raaziq, Goutham · Woofer: Farah'],
  ['prefercom','PreferCom — Preferment','Vaughn (Chair), Sophia D., Elliot, Daeden, Petra · Woofer: Urna'],
  ['rgc','RGC — Resident Guest & Upkeep','Adam S, Brume, Goutham · Woofer: Farah'],
  ['secretary','Secretary, Admin & Library','Farah, Sophie · Woofer: Urna'],
  ['treasury','Treasurers','Andy, Daeden · Woofer: Farah'],
  ['chairs','Chairs','Riya, Tahm · Woofer: Braden'],
  ['commscom','CommsCom — Communications & Computer','Himani, Petra, Gemmechu, Sophia D. · Woofer: Braden'],
  ['health','Health Liaison','Andy, Rejoice · Woofer: Sophie'],
  ['hag','HAG — House & Grounds','Adam S, Sophia D., Riya, Elliot · Woofer: Farah'],
  ['socialcom','SocialCom — Social & Internal Community','Mariah, Simran, Gemmechu, Raaz (+1 needed) · Woofer: Braden'],
  ['tasscom','TASSCom — TASSlications / SPARC','Elliot · Woofer: Braden'],
  ['custodianship','Custodianship','Urna · Woofer: Sophie'],
  ['cbc','CBC Liaison','Mariah · Woofer: Braden'],
  ['ds','Deep Springs Liaison','Tahm · Woofer: Sophie'],
  ['mbta','Michigan Branch Liaison','Vaughn, Raaziq · Woofer: Urna'],
  ['crwg','CRWG Liaison','Brume · Woofer: Urna']
];
const CSHORT = Object.fromEntries(COMMITTEES.map(c=>[c[0],c[1].split(' — ')[0]]));

const STANDING_RULES = [
  ['BIRTs: 24 hours','On the listserv 24h before the meeting that considers it.','Catputter’s Rules of Order'],
  ['Paid services: two weeks','Preliminary BIRT and purchase passed two weeks out.','CBTA Bylaws VII.5.7'],
  ['Service invoices: one week','Reimbursement forms to Treasurers a week before the event.','CBTA Bylaws VII.5.5–5.6'],
  ['Reimbursements: one month','To Treasurers within a month of purchase; none after the last day of class.','CBTA Bylaws VII.5.1–5.2'],
  ['Ten+ outside guests','Needs legislation in advance, naming who’s responsible for safety.','Social Gatherings Threshold'],
  ['Attendance: one week','Dispute the record within a week. Five tardies = one absence.','CBTA Bylaws V.4.d, V.1.b'],
  ['Event lengths','PubSpeaks one hour. Housemeeting until it finishes. CHEF as its BIRT says.','CBTA Bylaws V.1.a'],
  ['Vacating rooms','Two days after the last final, unless Head of Staff or MPM says otherwise.','TARP IV.A.1(d)']
];

/* ============================ date helpers ============================ */
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DOWFULL=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
function D(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12,0,0,0);}
function key(dt){return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');}
function addDays(dt,n){const x=new Date(dt);x.setDate(x.getDate()+n);return x;}
function todayKey(){return key(new Date());}
function fmtTime(t){if(!t)return'';let[h,m]=t.split(':').map(Number);const ap=h>=12?'pm':'am';h=h%12||12;return h+(m?':'+String(m).padStart(2,'0'):'')+ap;}
function fmtRange(a,b){if(!a)return'';return fmtTime(a)+(b?'–'+fmtTime(b):'');}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function uid(){return 'e'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}

/* ============================ data ============================ */
/* Events now live behind src/store.js (IndexedDB locally, Supabase when
   configured). There is no baked-in copy: the app starts with a loading
   state and fills in when the store delivers its first snapshot. */
/* ============================ state ============================ */
const state={
  view:'month',
  cursor:new Date(new Date().getFullYear(),new Date().getMonth(),1,12),
  day:new Date(new Date().getFullYear(),new Date().getMonth(),new Date().getDate(),12),
  events:[], filters:new Set(TRACK_KEYS), showBdays:true, showAcademic:true,
  committee:'', host:'', canWrite:true, authStatus:'loading', authEmail:null, editing:null
};

/* ============================ recurrence ============================ */
let BRK=new Set();
function breakDays(){
  const s=new Set();
  state.events.filter(e=>e.layer==='academic'&&e.isBreak).forEach(e=>{
    let d=D(e.date), end=D(e.endDate||e.date);
    while(d<=end){s.add(key(d));d=addDays(d,1);}
  });
  return s;
}
function occurrences(ev,from,to){
  if(ev.layer==='academic'||!ev.date) return [];
  const out=[], start=D(ev.date), until=ev.until?D(ev.until):null;
  const push=d=>{
    if(d<from||d>to) return;
    if(until&&d>until) return;
    if(ev.repeat!=='none'&&ev.skipBreaks!==false&&BRK.has(key(d))) return;
    out.push(key(d));
  };
  if(!ev.repeat||ev.repeat==='none'){
    let d=start, end=ev.endDate?D(ev.endDate):start;
    while(d<=end){ if(d>=from&&d<=to) out.push(key(d)); d=addDays(d,1); }
    return out;
  }
  if(ev.repeat==='annual'){
    for(let y=from.getFullYear();y<=to.getFullYear();y++){
      const d=new Date(y,start.getMonth(),start.getDate(),12);
      if(d>=from&&d<=to) out.push(key(d));
    }
    return out;
  }
  const step=ev.repeat==='weekly'?7:ev.repeat==='biweekly'?14:0;
  if(step){
    let d=new Date(start), guard=0;
    while(d<from) d=addDays(d,step);
    while(d<=to&&guard++<600){ push(d); d=addDays(d,step); }
    return out;
  }
  if(ev.repeat==='monthly'){
    for(let i=0;i<40;i++){
      const d=new Date(from.getFullYear(),from.getMonth()+i,start.getDate(),12);
      if(d>to) break;
      if(d>=start) push(d);
    }
  }
  return out;
}
function eventsByDay(from,to){
  const map={};
  state.events.forEach(ev=>{
    if(ev.layer==='academic'||ev.track==='bday') return;
    if(!state.filters.has(ev.track)) return;
    if(state.committee&&ev.track==='cm'&&ev.committee!==state.committee) return;
    if(state.host&&ev.track==='soc'&&ev.host!==state.host) return;
    occurrences(ev,from,to).forEach(k=>{(map[k]=map[k]||[]).push(ev);});
  });
  Object.values(map).forEach(l=>l.sort((a,b)=>(a.start||'zz').localeCompare(b.start||'zz')||a.title.localeCompare(b.title)));
  return map;
}
function birthdaysByDay(from,to){
  const map={};
  if(!state.showBdays) return map;
  state.events.filter(e=>e.track==='bday').forEach(ev=>{
    occurrences(Object.assign({},ev,{repeat:'annual'}),from,to).forEach(k=>{(map[k]=map[k]||[]).push(ev);});
  });
  return map;
}
function academicByDay(from,to){
  const map={};
  if(!state.showAcademic) return map;
  state.events.filter(e=>e.layer==='academic').forEach(e=>{
    let d=D(e.date), end=D(e.endDate||e.date);
    while(d<=end){ if(d>=from&&d<=to){const k=key(d);(map[k]=map[k]||[]).push(e);} d=addDays(d,1); }
  });
  return map;
}

/* ============================ legend ============================ */
function renderLegend(){
  const L=document.getElementById('legend');
  let h=TRACK_KEYS.map(k=>{
    const t=TRACKS[k];
    return '<button class="chip" data-track="'+k+'" aria-pressed="'+state.filters.has(k)+'" title="'+esc(t.blurb)+'">'+glyphSVG(t.glyph,t.color)+esc(t.name)+'</button>';
  }).join('');
  h+='<span class="legend-sep"></span>';
  h+='<button class="chip" data-layer="bday" aria-pressed="'+state.showBdays+'">'+glyphSVG('cake','var(--accent)')+'Birthdays</button>';
  h+='<button class="chip" data-layer="academic" aria-pressed="'+state.showAcademic+'">'+glyphSVG('cornell','var(--ink-2)')+'Cornell calendar</button>';
  h+='<span class="legend-sep"></span>';
  h+='<span class="selwrap"><label for="cfilter">Committee</label><select class="mini" id="cfilter"><option value="">All</option>'+
     COMMITTEES.map(c=>'<option value="'+c[0]+'"'+(state.committee===c[0]?' selected':'')+'>'+esc(CSHORT[c[0]])+'</option>').join('')+'</select></span>';
  h+='<span class="selwrap"><label for="hfilter">Socials</label><select class="mini" id="hfilter"><option value="">Both</option>'+
     '<option value="house"'+(state.host==='house'?' selected':'')+'>In the House</option>'+
     '<option value="external"'+(state.host==='external'?' selected':'')+'>Elsewhere</option></select></span>';
  L.innerHTML=h;
  L.querySelectorAll('[data-track]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.track; state.filters.has(k)?state.filters.delete(k):state.filters.add(k); renderLegend(); render();
  });
  L.querySelectorAll('[data-layer]').forEach(b=>b.onclick=()=>{
    if(b.dataset.layer==='bday') state.showBdays=!state.showBdays; else state.showAcademic=!state.showAcademic;
    renderLegend(); render();
  });
  document.getElementById('cfilter').onchange=e=>{state.committee=e.target.value;render();};
  document.getElementById('hfilter').onchange=e=>{state.host=e.target.value;render();};
}

/* ============================ views ============================ */
function render(){
  BRK=breakDays();
  document.getElementById('tabs').querySelectorAll('button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.view===state.view)));
  ({day:renderDay,month:renderMonth,agenda:renderAgenda,term:renderTerm}[state.view])();
  renderTray(); renderRules(); renderStatus();
}
function renderDay(){
  const d=state.day, k=key(d);
  document.getElementById('period').textContent=MONTHS[d.getMonth()].slice(0,3)+' '+d.getDate();
  const ev=eventsByDay(d,d)[k]||[], bd=birthdaysByDay(d,d)[k]||[], ac=academicByDay(d,d)[k]||[];
  let rail='<div class="dayrail"><div class="dow">'+DOWFULL[d.getDay()]+'</div><div class="num">'+d.getDate()+'</div>'+
    '<div class="mo">'+MONTHS[d.getMonth()]+' '+d.getFullYear()+'</div>';
  if(ac.length||bd.length){
    rail+='<div class="note">';
    ac.forEach(a=>{rail+='<div>'+glyphSVG('cornell','var(--ink-2)')+'<span>'+esc(a.title)+'</span></div>';});
    bd.forEach(b=>{rail+='<div>'+glyphSVG('cake','var(--accent)')+'<span>'+esc(b.title)+'</span></div>';});
    rail+='</div>';
  }
  rail+='</div>';
  let items='<div class="dayitems">';
  if(!ev.length) items+='<p class="empty">Nothing on the calendar. A good day for a CHEF.</p>';
  ev.forEach(e=>{
    const t=TRACKS[e.track];
    let meta='<span class="tag">'+glyphSVG(t.glyph,t.color)+esc(t.short)+'</span>';
    if(e.committee) meta+='<span class="tag">'+esc(CSHORT[e.committee]||e.committee)+'</span>';
    if(e.host) meta+='<span class="tag">'+(e.host==='house'?'In the House':'Elsewhere')+'</span>';
    if(e.where) meta+='<span>'+esc(e.where)+'</span>';
    if(e.unconfirmed) meta+='<span class="tag warn">Unconfirmed</span>';
    items+='<button class="ditem" data-ev="'+e.id+'"><span class="when">'+esc(e.start?fmtRange(e.start,e.end):'all day')+'</span>'+
      '<span class="bar" style="background:'+t.color+'"></span><span class="body"><span class="h">'+esc(e.title)+'</span>'+
      '<span class="ameta">'+meta+'</span>'+(e.notes?'<p>'+esc(e.notes)+'</p>':'')+'</span></button>';
  });
  items+='</div>';
  const V=document.getElementById('view'); V.innerHTML='<div class="dayview">'+rail+items+'</div>';
  V.querySelectorAll('[data-ev]').forEach(b=>b.onclick=()=>openEvent(b.dataset.ev));
}
function renderMonth(){
  const c=state.cursor, y=c.getFullYear(), m=c.getMonth();
  document.getElementById('period').textContent=MONTHS[m]+' '+y;
  const first=new Date(y,m,1,12), gridStart=addDays(first,-first.getDay()), gridEnd=addDays(gridStart,41);
  const ev=eventsByDay(gridStart,gridEnd), bd=birthdaysByDay(gridStart,gridEnd), ac=academicByDay(gridStart,gridEnd), tk=todayKey();
  let h='<div class="grid-head">'+DOW.map(d=>'<div>'+d+'</div>').join('')+'</div><div class="grid">';
  for(let i=0;i<42;i++){
    const d=addDays(gridStart,i), k=key(d), out=d.getMonth()!==m, acs=ac[k]||[];
    const cls=['cell']; if(out)cls.push('out'); if(acs.some(a=>a.isBreak))cls.push('brk'); if(k===tk)cls.push('today');
    h+='<button class="'+cls.join(' ')+'" data-day="'+k+'"><span class="cell-top"><span class="daynum">'+d.getDate()+'</span>';
    if(acs.length) h+='<span class="brklabel">'+esc(acs[0].title)+'</span>';
    const bl=bd[k]||[];
    if(bl.length) h+='<span class="bdays">'+glyphSVG('cake','var(--accent)')+'<span>'+esc(bl.map(b=>b.title.replace(/[’']s birthday$/i,'')).join(', '))+'</span></span>';
    h+='</span>';
    const list=ev[k]||[];
    list.slice(0,3).forEach(e=>{
      h+='<span class="ev'+(e.unconfirmed?' tbd':'')+'"><span class="bar" style="background:'+TRACKS[e.track].color+'"></span>'+
         (e.start?'<span class="hr">'+esc(fmtTime(e.start))+'</span>':'')+
         '<span class="t">'+esc(e.title)+(e.unconfirmed?' ?':'')+'</span></span>';
    });
    if(list.length>3) h+='<span class="more">'+(list.length-3)+' more</span>';
    h+='</button>';
  }
  h+='</div>';
  const V=document.getElementById('view'); V.innerHTML=h;
  V.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>openDay(b.dataset.day));
}
function renderAgenda(){
  const c=state.cursor, from=new Date(c.getFullYear(),c.getMonth(),1,12), to=new Date(c.getFullYear(),c.getMonth()+1,0,12);
  document.getElementById('period').textContent=MONTHS[c.getMonth()]+' '+c.getFullYear();
  const ev=eventsByDay(from,to), bd=birthdaysByDay(from,to), ac=academicByDay(from,to), tk=todayKey();
  let h='<div class="agenda">', any=false;
  for(let d=new Date(from);d<=to;d=addDays(d,1)){
    const k=key(d), list=ev[k]||[], bl=bd[k]||[], al=ac[k]||[];
    if(!list.length&&!bl.length&&!al.length) continue;
    any=true;
    h+='<div class="arow'+(k===tk?' is-today':'')+'"><div class="adate">'+DOW[d.getDay()]+'<b>'+d.getDate()+'</b></div><div class="aitems">';
    al.forEach(a=>{h+='<div class="aitem"><span class="bar" style="background:var(--rule-strong)"></span><div><div class="atitle" style="font-weight:500;color:var(--ink-2)">'+esc(a.title)+'</div><div class="ameta"><span class="tag">'+glyphSVG('cornell','var(--ink-2)')+'Cornell</span></div></div></div>';});
    bl.forEach(b=>{h+='<div class="aitem"><span class="bar" style="background:var(--accent)"></span><div><div class="atitle">'+esc(b.title)+'</div><div class="ameta"><span class="tag">'+glyphSVG('cake','var(--accent)')+'Birthday</span></div></div></div>';});
    list.forEach(e=>{
      const t=TRACKS[e.track];
      let meta='<span class="tag">'+glyphSVG(t.glyph,t.color)+esc(t.short)+'</span>';
      if(e.committee) meta+='<span class="tag">'+esc(CSHORT[e.committee]||e.committee)+'</span>';
      if(e.host) meta+='<span class="tag">'+(e.host==='house'?'In the House':'Elsewhere')+'</span>';
      if(e.start) meta+='<span class="mono">'+esc(fmtRange(e.start,e.end))+'</span>';
      if(e.where) meta+='<span>'+esc(e.where)+'</span>';
      if(e.unconfirmed) meta+='<span class="tag warn">Unconfirmed</span>';
      h+='<button class="aitem" data-ev="'+e.id+'"><span class="bar" style="background:'+t.color+'"></span><div style="min-width:0"><div class="atitle">'+esc(e.title)+'</div><div class="ameta">'+meta+'</div></div></button>';
    });
    h+='</div></div>';
  }
  h+='</div>';
  const V=document.getElementById('view');
  V.innerHTML=any?h:'<p class="empty">Nothing on the grid this month with these filters on.</p>';
  V.querySelectorAll('[data-ev]').forEach(b=>b.onclick=()=>openEvent(b.dataset.ev));
}
function renderTerm(){
  const y=state.cursor.getFullYear(), m=state.cursor.getMonth(), fall=m>=7;
  const yr=fall?y:(m<=6?y:y+1);
  const from=fall?D(y+'-08-24'):D(yr+'-01-25'), to=fall?D(y+'-12-19'):D(yr+'-05-22');
  document.getElementById('period').textContent=fall?('Fall '+y):('Spring '+yr);
  const ev=eventsByDay(from,to), ac=academicByDay(from,to), tk=todayKey();
  const tracks=TRACK_KEYS.filter(k=>state.filters.has(k));
  let h='<div class="termwrap"><table class="term"><thead><tr><th>Week</th>'+tracks.map(k=>'<th>'+esc(TRACKS[k].name)+'</th>').join('')+'</tr></thead><tbody>';
  let wkStart=addDays(from,-from.getDay()), n=0;
  while(wkStart<=to&&n++<20){
    const wkEnd=addDays(wkStart,6), cells=tracks.map(()=>[]);
    let brkName='', isNow=false;
    for(let d=new Date(wkStart);d<=wkEnd;d=addDays(d,1)){
      const k=key(d);
      if(k===tk) isNow=true;
      (ac[k]||[]).forEach(a=>{if(a.isBreak&&!brkName) brkName=a.title;});
      (ev[k]||[]).forEach(e=>{
        const i=tracks.indexOf(e.track); if(i<0||cells[i].some(x=>x.id===e.id)) return;
        cells[i].push({id:e.id,title:e.title,day:DOW[d.getDay()],unconfirmed:e.unconfirmed});
      });
    }
    h+='<tr'+(isNow?' class="now"':'')+'><td><span class="wk'+(brkName?' brk':'')+'">'+MONTHS[wkStart.getMonth()].slice(0,3)+' '+wkStart.getDate()+
       '<small>'+(brkName?esc(brkName):'week of')+'</small></span></td>';
    cells.forEach((list,i)=>{
      h+='<td><div class="tcell">'+list.map(x=>'<button data-ev="'+x.id+'"><span class="dot" style="background:'+TRACKS[tracks[i]].color+'"></span><span>'+esc(x.title)+(x.unconfirmed?' ?':'')+' <span style="color:var(--muted)">'+x.day+'</span></span></button>').join('')+'</div></td>';
    });
    h+='</tr>';
    wkStart=addDays(wkStart,7);
  }
  h+='</tbody></table></div>';
  const V=document.getElementById('view'); V.innerHTML=h;
  V.querySelectorAll('[data-ev]').forEach(b=>b.onclick=()=>openEvent(b.dataset.ev));
}
function renderTray(){
  const T=document.getElementById('tray');
  const items=state.events.filter(e=>e.layer!=='academic'&&!e.date&&state.filters.has(e.track));
  if(!items.length){T.innerHTML='';return;}
  items.sort((a,b)=>TRACK_KEYS.indexOf(a.track)-TRACK_KEYS.indexOf(b.track)||a.title.localeCompare(b.title));
  T.innerHTML='<div class="sec-h"><h2>Needs a date</h2><p>Real obligations with nobody’s finger on a day yet. Open one, give it a date, and it moves onto the grid.</p></div><div class="traygrid">'+
    items.map(e=>'<button class="traycard" data-ev="'+e.id+'" style="border-left-color:'+TRACKS[e.track].color+'"><h4>'+esc(e.title)+'</h4><p>'+esc(TRACKS[e.track].name)+(e.committee?' · '+esc(CSHORT[e.committee]||''):'')+'</p></button>').join('')+'</div>';
  T.querySelectorAll('[data-ev]').forEach(b=>b.onclick=()=>openEvent(b.dataset.ev));
}
function renderRules(){
  const R=document.getElementById('rulelist');
  if(R.dataset.done) return;
  R.innerHTML=STANDING_RULES.map(r=>'<div class="rule"><b>'+esc(r[0])+'</b><p>'+esc(r[1])+'</p><span class="cite">'+esc(r[2])+'</span></div>').join('');
  R.dataset.done='1';
}
function renderStatus(){
  const S=document.getElementById('statusbanner');
  const remote = window.HouseStore && HouseStore.mode==='remote';
  if(state.authStatus==='loading'){
    S.innerHTML='<div class="banner"><b>Loading the calendar…</b></div>';
  } else if(remote && state.authStatus==='signed-out'){
    S.innerHTML='<div class="banner"><b>This is the House calendar.</b> Enter the house password to view and edit it.'+
      '<div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">'+
      '<input type="password" id="pw" placeholder="House password" autocomplete="current-password" '+
        'style="flex:1 1 180px;max-width:280px;border:1px solid var(--rule-strong);background:var(--bg);border-radius:8px;padding:6px 9px;font-size:16px">'+
      '<button class="btn btn-primary" id="signin">Enter</button></div>'+
      '<span id="pwmsg" style="display:none;color:var(--t-dl);font-size:14px;margin-top:6px"></span></div>';
    const go=()=>{
      const pw=$('pw').value; const msg=$('pwmsg');
      msg.style.display='none';
      $('signin').textContent='Checking…';
      HouseStore.auth.signIn(pw).catch(()=>{ msg.textContent='That password didn’t work. Try again.'; msg.style.display='block'; $('signin').textContent='Enter'; $('pw').select(); });
    };
    $('signin').onclick=go;
    $('pw').onkeydown=e=>{ if(e.key==='Enter') go(); };
  } else if(state.canWrite===false){
    S.innerHTML='<div class="banner"><b>You can read this calendar but not write to it.</b> Use <b>+ Add</b> anyway — it will hand you the entry as text to send to whoever keeps the calendar.</div>';
  } else S.innerHTML='';
}

/* ============================ drawer ============================ */
function openDay(k){
  const d=D(k);
  const ev=eventsByDay(d,d)[k]||[], bd=birthdaysByDay(d,d)[k]||[], ac=academicByDay(d,d)[k]||[];
  document.getElementById('panel-sub').textContent=DOWFULL[d.getDay()]+' · '+MONTHS[d.getMonth()]+' '+d.getDate();
  document.getElementById('panel-title').textContent=(ev.length+bd.length)?((ev.length+bd.length)+' on the calendar'):'Nothing yet';
  const B=document.getElementById('panel-b');
  let h='';
  ac.forEach(a=>{h+='<div class="detail" style="border-left-color:var(--rule-strong)"><h4>'+esc(a.title)+'</h4><div class="ameta"><span class="tag">'+glyphSVG('cornell','var(--ink-2)')+'Cornell calendar</span></div></div>';});
  bd.forEach(b=>{h+='<div class="detail" style="border-left-color:var(--accent)"><h4>'+esc(b.title)+'</h4><div class="ameta"><span class="tag">'+glyphSVG('cake','var(--accent)')+'Birthday</span></div>'+(b.notes?'<p class="note">'+esc(b.notes)+'</p>':'')+'<div class="acts"><button class="btn" data-edit="'+b.id+'">Edit</button></div></div>';});
  ev.forEach(e=>{h+=detailCard(e);});
  B.innerHTML=h||'<p class="empty">Nothing here. A good day for a CHEF.</p>';
  B.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openForm(byId(b.dataset.edit)));
  document.getElementById('panel-add').onclick=()=>{closePanel();openForm(null,k);};
  openPanel();
}
function detailCard(e){
  const t=TRACKS[e.track]||TRACKS.hm;
  let meta='<span class="tag">'+glyphSVG(t.glyph,t.color)+esc(t.short)+'</span>';
  if(e.committee) meta+='<span class="tag">'+esc(CSHORT[e.committee]||e.committee)+'</span>';
  if(e.host) meta+='<span class="tag">'+(e.host==='house'?'In the House':'Elsewhere')+'</span>';
  if(e.start) meta+='<span class="mono">'+esc(fmtRange(e.start,e.end))+'</span>';
  if(e.where) meta+='<span>'+esc(e.where)+'</span>';
  if(e.repeat&&e.repeat!=='none') meta+='<span>'+({weekly:'weekly',biweekly:'every other week',monthly:'monthly',annual:'yearly'}[e.repeat])+'</span>';
  if(e.unconfirmed) meta+='<span class="tag warn">Unconfirmed</span>';
  return '<div class="detail" style="border-left-color:'+t.color+'"><h4>'+esc(e.title)+'</h4><div class="ameta">'+meta+'</div>'+
    (e.notes?'<p class="note">'+esc(e.notes)+'</p>':'')+
    (e.link?'<a class="linkout" href="'+esc(e.link)+'" target="_blank" rel="noopener">Open link &#8599;</a>':'')+
    '<div class="acts"><button class="btn" data-edit="'+e.id+'">Edit</button></div></div>';
}
function openEvent(id){
  const e=byId(id); if(!e) return;
  document.getElementById('panel-sub').textContent=TRACKS[e.track]?TRACKS[e.track].name:'Entry';
  document.getElementById('panel-title').textContent=e.date?(MONTHS[D(e.date).getMonth()]+' '+D(e.date).getDate()):'Needs a date';
  const B=document.getElementById('panel-b'); B.innerHTML=detailCard(e);
  B.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openForm(e));
  document.getElementById('panel-add').onclick=()=>{closePanel();openForm(null,e.date||'');};
  openPanel();
}
function byId(id){return state.events.find(e=>e.id===id);}
const $=id=>document.getElementById(id);
function openPanel(){$('panel').classList.add('on');$('panel').setAttribute('aria-hidden','false');$('scrim').classList.add('on');}
function closePanel(){$('panel').classList.remove('on');$('panel').setAttribute('aria-hidden','true');if(!$('modal').classList.contains('on'))$('scrim').classList.remove('on');}

/* ============================ form ============================ */
function fillSelects(){
  $('f-track').innerHTML=TRACK_KEYS.map(k=>'<option value="'+k+'">'+esc(TRACKS[k].name)+'</option>').join('')+'<option value="bday">Birthday</option>';
  $('f-committee').innerHTML='<option value="">&mdash;</option>'+COMMITTEES.map(c=>'<option value="'+c[0]+'">'+esc(CSHORT[c[0]])+'</option>').join('');
}
function syncFormBits(){
  const tr=$('f-track').value;
  $('wrap-committee').style.display=tr==='cm'?'':'none';
  $('wrap-host').style.display=tr==='soc'?'':'none';
  const isB=tr==='bday';
  $('date-hint').innerHTML=isB
    ? 'Pick any year — only the month and day are used, and it repeats forever. Title it like <b>Petra’s birthday</b>.'
    : 'Leave the date blank and it goes to <b>Needs a date</b> instead of the grid.';
  if(isB) $('f-repeat').value='annual';
}
function openForm(ev,presetDate){
  state.editing=ev||null;
  $('form-sub').textContent=ev?'Editing':'New entry';
  $('form-title').textContent=ev?ev.title:'Add to the calendar';
  $('delete').hidden=!ev;
  $('form-msg').innerHTML='';
  $('f-title').value=ev?ev.title:'';
  $('f-track').value=ev?ev.track:'forum';
  $('f-committee').value=ev&&ev.committee?ev.committee:'';
  $('f-date').value=ev?(ev.date||''):(presetDate||'');
  $('f-start').value=ev?(ev.start||''):'';
  $('f-end').value=ev?(ev.end||''):'';
  $('f-repeat').value=ev?(ev.repeat||'none'):'none';
  $('f-until').value=ev?(ev.until||''):'';
  $('f-skip').checked=ev?ev.skipBreaks!==false:true;
  $('f-where').value=ev?(ev.where||''):'';
  $('f-host').value=ev?(ev.host||''):'';
  $('f-link').value=ev?(ev.link||''):'';
  $('f-notes').value=ev?(ev.notes||''):'';
  $('f-confirm').checked=ev?!!ev.unconfirmed:false;
  syncFormBits();
  $('modal').classList.add('on'); $('modal').setAttribute('aria-hidden','false'); $('scrim').classList.add('on');
  setTimeout(()=>$('f-title').focus(),60);
}
function closeForm(){
  $('modal').classList.remove('on'); $('modal').setAttribute('aria-hidden','true');
  if(!$('panel').classList.contains('on'))$('scrim').classList.remove('on');
  state.editing=null;
}
function collect(){
  const tr=$('f-track').value;
  return {
    id: state.editing?state.editing.id:uid(), layer:'event', track:tr,
    title:$('f-title').value.trim(),
    committee: tr==='cm'?$('f-committee').value:'',
    date:$('f-date').value||null, start:$('f-start').value||'', end:$('f-end').value||'',
    repeat: tr==='bday'?'annual':$('f-repeat').value,
    until:$('f-until').value||null, skipBreaks:$('f-skip').checked,
    where:$('f-where').value.trim(), host: tr==='soc'?$('f-host').value:'',
    link:$('f-link').value.trim(), notes:$('f-notes').value.trim(),
    unconfirmed:$('f-confirm').checked,
    endDate: state.editing?(state.editing.endDate||null):null,
    updated_at:new Date().toISOString()
  };
}
function asText(o){
  const L=[o.title];
  L.push('Track: '+(TRACKS[o.track]?TRACKS[o.track].name:'Birthday'));
  if(o.committee) L.push('Committee: '+(CSHORT[o.committee]||o.committee));
  L.push('Date: '+(o.date||'no date yet')+(o.start?' '+fmtRange(o.start,o.end):''));
  if(o.repeat&&o.repeat!=='none') L.push('Repeats: '+o.repeat+(o.until?' until '+o.until:''));
  if(o.where) L.push('Where: '+o.where);
  if(o.host) L.push('Hosted: '+(o.host==='house'?'in the House':'elsewhere'));
  if(o.link) L.push('Link: '+o.link);
  if(o.notes) L.push('Notes: '+o.notes);
  return L.join('\n');
}
function offerText(o,why){
  $('form-msg').innerHTML='<div class="banner"><b>'+esc(why)+'</b> Copy this and send it to whoever keeps the calendar.</div>'+
    '<textarea class="copybox" readonly id="copybox">'+esc(asText(o))+'</textarea>';
  const box=$('copybox'); box.focus(); box.select();
}
async function save(){
  const o=collect();
  if(!o.title){$('f-title').focus();return;}
  if(!state.canWrite){ offerText(o,'Not saved — you have read access to this calendar, not write access.'); return; }
  try{ await HouseStore.put(o); closeForm(); }
  catch(err){
    if(err&&err.code==='not_allowed'){ state.canWrite=false; renderStatus(); offerText(o,'Not saved — you have read access to this calendar, not write access.'); }
    else offerText(o,'Not saved — '+((err&&err.message)||'something went wrong on the way to the calendar')+'.');
  }
}
async function removeEvent(){
  if(!state.editing) return;
  if(state.canWrite){ try{ await HouseStore.remove(state.editing.id); }catch(e){} }
  closeForm();
}

/* ============================ wiring ============================ */
function shift(n){
  if(state.view==='day'){ state.day=addDays(state.day,n); state.cursor=new Date(state.day.getFullYear(),state.day.getMonth(),1,12); }
  else if(state.view==='term') state.cursor=new Date(state.cursor.getFullYear(),state.cursor.getMonth()+n*5,1,12);
  else state.cursor=new Date(state.cursor.getFullYear(),state.cursor.getMonth()+n,1,12);
  render();
}
function goToday(){
  const n=new Date();
  state.day=new Date(n.getFullYear(),n.getMonth(),n.getDate(),12);
  state.cursor=new Date(n.getFullYear(),n.getMonth(),1,12);
  render();
}
function toggleTV(){
  const on=!document.documentElement.classList.contains('tv');
  document.documentElement.classList.toggle('tv',on);
  try{ on?document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen():document.fullscreenElement&&document.exitFullscreen(); }catch(e){}
  render();
}
$('prev').onclick=()=>shift(-1);
$('next').onclick=()=>shift(1);
$('today').onclick=goToday;
$('tv').onclick=toggleTV;
$('tabs').onclick=e=>{const b=e.target.closest('button'); if(!b)return; state.view=b.dataset.view; render();};
$('add').onclick=()=>openForm(null,state.view==='day'?key(state.day):'');
$('panel-x').onclick=closePanel;
$('modal-x').onclick=closeForm;
$('cancel').onclick=closeForm;
$('save').onclick=save;
$('delete').onclick=removeEvent;
$('scrim').onclick=()=>{closeForm();closePanel();};
$('f-track').onchange=syncFormBits;
$('form').onsubmit=e=>{e.preventDefault();save();};
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeForm();closePanel();return;}
  if($('modal').classList.contains('on')||$('panel').classList.contains('on')) return;
  if(e.target&&/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  if(e.key==='f'||e.key==='F') toggleTV();
  else if(e.key==='ArrowLeft') shift(-1);
  else if(e.key==='ArrowRight') shift(1);
  else if(e.key==='t'||e.key==='T') goToday();
});
document.addEventListener('fullscreenchange',()=>{
  if(!document.fullscreenElement&&document.documentElement.classList.contains('tv')){
    document.documentElement.classList.remove('tv'); render();
  }
});

/* ============================ boot ============================ */
fillSelects();
renderLegend();
render();

/* All storage lives behind src/store.js. We react to two streams from it:
   the current events (a snapshot that replaces state.events) and the auth
   state (whether someone is signed in and allowed to write). */
HouseStore.auth.onChange(a=>{
  state.authStatus = a.status;
  state.authEmail  = a.user && a.user.email;
  state.canWrite   = a.canWrite;
  renderStatus();
});
HouseStore.subscribe(rows=>{
  state.events = rows;
  // In local mode there is no sign-in, so the first snapshot means we're ready.
  if(HouseStore.mode==='local' && state.authStatus==='loading') state.authStatus='ready';
  render();
});
</script>
